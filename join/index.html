<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening Skapersøk</title>
    <style>
        :root {
            --bg: #0f1216;
            --surface: #151a21;
            --surface-strong: #1a212b;
            --text: #e9edf2;
            --text-soft: #aeb7c2;
            --line: #283241;
            --accent: #79b8ff;
            --accent-soft: #bcdcff;
            --ok: #7ee081;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(900px 460px at 12% -8%, #1a2230 0%, var(--bg) 58%);
            color: var(--text);
            font-family: "Montserrat", "Segoe UI", sans-serif;
        }

        .card {
            width: min(560px, 100%);
            background: linear-gradient(180deg, var(--surface-strong) 0%, var(--surface) 100%);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 3.4vw, 2rem);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: var(--text-soft);
        }

        .status {
            margin-top: 12px;
            color: var(--ok);
            font-size: 0.95rem;
            min-height: 1.5em;
        }

        .actions {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            text-decoration: none;
            font-weight: 600;
            transition: transform 120ms ease, border-color 120ms ease, background-color 120ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            color: var(--text);
            background: #172033;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #1f2b42;
            border-color: var(--accent-soft);
        }

        .btn-outline {
            color: var(--accent-soft);
            border-color: var(--line);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            background: #172033;
            color: var(--text);
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Åpner Skapersøk</h1>
        <p>Vi prøver å åpne appen automatisk. Hvis ingenting skjer, velg et alternativ under.</p>
        <p class="status" id="statusText" aria-live="polite">Klargjører...</p>

        <section class="actions" aria-label="Alternativer">
            <a class="btn btn-primary" href="/app">Gå til web-appen</a>
            <a class="btn btn-outline" href="https://play.google.com/store/apps/details?id=no.skapersok.app">
                Last ned Android-app
            </a>
        </section>
    </main>

    <script>
        const statusText = document.getElementById("statusText");
        const params = new URLSearchParams(window.location.search);

        const ip = params.get("ip");
        const port = params.get("port") || "80";
        const scheme = params.get("scheme") || "http";

        if (ip) {
            statusText.textContent = "Prøver å åpne appen...";
            const url = `skapersok://join?ip=${ip}&port=${port}&scheme=${scheme}`;
            window.location.href = url;

            // fallback after 2 seconds
            setTimeout(() => {
                statusText.textContent = "Fant ikke appen. Sender deg til Google Play...";
                window.location.href = "https://play.google.com/store/apps/details?id=no.skapersok.app";
            }, 2000);
        } else {
            statusText.textContent = "Mangler koblingsdata. Du kan bruke web-appen i stedet.";
        }
    </script>
</body>

</html>
