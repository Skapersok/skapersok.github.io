<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>Opening Skapersøk</title>
    <style>
        :root {
            --bg: #0f1216;
            --surface: #151a21;
            --surface-strong: #1a212b;
            --text: #e9edf2;
            --text-soft: #aeb7c2;
            --line: #283241;
            --accent: #79b8ff;
            --accent-soft: #bcdcff;
            --ok: #7ee081;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(900px 460px at 12% -8%, #1a2230 0%, var(--bg) 58%);
            color: var(--text);
            font-family: "Montserrat", "Segoe UI", sans-serif;
        }

        .card {
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 3.4vw, 2rem);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: var(--text-soft);
        }

        .status {
            margin-top: 12px;
            color: var(--ok);
            font-size: 0.95rem;
            min-height: 1.5em;
        }

        .actions {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Åpner Skapersøk</h1>
        <p>Vi sender deg videre til riktig versjon av Skapersøk.</p>
        <p class="status" id="statusText" aria-live="polite">Klargjører...</p>

        <section class="actions" aria-label="Alternativer">
            <a class="product-btn blue-btn" href="https://app.skapersok.no" id="web-app-button">Gå til web-appen</a>
            <a class="product-btn outlined-btn" href="/android_beta/index.html">
                Last ned Android-app
            </a>
        </section>
    </main>

    <script>
        const webAppButton = document.getElementById("web-app-button");
        const statusText = document.getElementById("statusText");
        const params = new URLSearchParams(window.location.search);

        const serverUrl = params.get("url");
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (serverUrl) {
            const encodedServerUrl = encodeURIComponent(serverUrl);
            const webAppUrl = `https://app.skapersok.no/#/join?url=${encodedServerUrl}`;

            webAppButton.href = webAppUrl;

            if (isMobile) {
                let didLeavePage = false;

                const markPageHidden = () => {
                    if (document.hidden) didLeavePage = true;
                };

                document.addEventListener("visibilitychange", markPageHidden);

                statusText.textContent = "Prøver å åpne mobilappen...";
                window.location.href = `skapersok://join?url=${encodedServerUrl}`;

                // If the app actionsheet is not opened within 1.8 seconds, redirect to the web app instead
                setTimeout(() => {
                    document.removeEventListener("visibilitychange", markPageHidden);

                    if (!didLeavePage && !document.hidden) {
                        statusText.textContent = "Åpner web-appen...";
                        window.location.href = webAppUrl;
                    }
                }, 1800);
            } else {
                statusText.textContent = "Åpner web-appen...";
                window.location.href = webAppUrl;
            }
        } else {
            statusText.textContent = "Mangler koblingsdata. Du kan bruke web-appen i stedet.";
            webAppButton.href = "https://app.skapersok.no";
        }
    </script>
</body>

</html>
